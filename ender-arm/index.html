<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ender-Arm Control Panel & App Database</title>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181c26;
      --border: #2a3040;
      --text: #e6e9f2;
      --muted: #8b94a8;
      --accent: #4f8cff;
      --accent-hover: #3b78eb;
      --green: #2ecc71;
      --red: #e74c3c;
      --amber: #f39c12;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 1.35rem; display: flex; align-items: center; gap: 10px; }
    .badge {
      font-size: 0.75rem; padding: 4px 10px; border-radius: 999px;
      background: #232836; color: var(--muted); border: 1px solid var(--border);
    }
    .badge.connected { background: rgba(46,204,113,0.15); color: var(--green); border-color: var(--green); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 0.88rem;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.98); }
    button.secondary { background: #252b3b; color: var(--text); border: 1px solid var(--border); }
    button.secondary:hover { background: #2f374a; }
    button.danger { background: var(--red); }
    button.danger:hover { background: #c0392b; }
    button.success { background: var(--green); color: #0b1911; }
    button.small { padding: 5px 10px; font-size: 0.8rem; }

    .grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 18px; display: flex; flex-direction: column; gap: 14px;
    }
    .card h2 { margin: 0; font-size: 1.05rem; color: #fff; display: flex; justify-content: space-between; align-items: center; }

    .joint {
      background: #121620; border: 1px solid var(--border); border-radius: 10px; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .joint-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .joint-val { font-family: ui-monospace, Consolas, monospace; color: var(--accent); font-weight: 700; }
    .joint-controls { display: flex; align-items: center; gap: 8px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
    input[type="text"], input[type="number"], textarea {
      background: #10131c; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; width: 100%;
    }
    .row { display: flex; gap: 8px; align-items: center; }

    .app-list { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; }
    .app-item {
      background: #121620; border: 1px solid var(--border); border-radius: 10px; padding: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .app-meta { display: flex; flex-direction: column; gap: 3px; }
    .app-name { font-weight: 700; font-size: 0.95rem; }
    .app-desc { font-size: 0.78rem; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }

    .console {
      background: #0b0d12; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px; height: 180px; overflow-y: auto; font-family: ui-monospace, Consolas, monospace;
      font-size: 0.8rem; line-height: 1.45; white-space: pre-wrap;
    }
    .log-tx { color: #7cb3ff; }
    .log-rx { color: #8be9a8; }
    .log-sys { color: #f39c12; }

    .motor-pills { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .pill {
      background: #121620; color: var(--muted); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 8px; text-align: center; cursor: pointer;
      font-weight: 700; font-size: 0.88rem; transition: all 0.15s;
    }
    .pill:hover { border-color: var(--accent); color: var(--text); }
    .pill.active { background: rgba(79,140,255,0.2); border-color: var(--accent); color: #fff; }
    .spin-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>
      🦾 Ender-Arm Control Panel
      <span id="statusBadge" class="badge">Disconnected</span>
    </h1>
    <div class="toolbar">
      <button id="connectBtn">🔌 Connect USB (SKR Mini E3)</button>
      <button class="secondary" onclick="sendZero()">🎯 Zero Here (G92)</button>
      <button class="secondary" onclick="sendCmd('M18')">🔓 Free Motors (M18)</button>
      <button class="danger" onclick="sendCmd('M112')">🛑 E-STOP</button>
    </div>
  </header>

  <!-- QUICK MOTOR SPIN -->
  <div class="card" style="margin-bottom: 20px;">
    <h2>
      ⚡ Quick Motor Spin
      <span style="font-size:0.8rem; color:var(--muted); font-weight:400;">
        Pick a motor &amp; click to spin relative to current position
      </span>
    </h2>
    <div class="motor-pills" id="motorPills">
      <button class="pill active" onclick="selectMotor('X', this)">XM (Base)</button>
      <button class="pill" onclick="selectMotor('Y', this)">YM (Shoulder)</button>
      <button class="pill" onclick="selectMotor('Z', this)">ZAM (Elbow)</button>
      <button class="pill" onclick="selectMotor('A', this)">EM (Wrist)</button>
    </div>
    <div class="spin-grid">
      <button class="secondary" onclick="quickSpin(-360)">⟲ -360° (1 rev)</button>
      <button class="secondary" onclick="quickSpin(-90)">⟲ -90°</button>
      <button class="secondary" onclick="quickSpin(-45)">⟲ -45°</button>
      <button class="success" onclick="quickSpin(45)">⟳ +45°</button>
      <button class="success" onclick="quickSpin(90)">⟳ +90°</button>
      <button class="success" onclick="quickSpin(360)">⟳ +360° (1 rev)</button>
    </div>
    <div class="row">
      <input id="customDeg" type="number" value="180" style="max-width:120px;" />
      <span style="color:var(--muted); font-size:0.85rem;">degrees</span>
      <button onclick="quickSpin(Number(document.getElementById('customDeg').value))">▶ Spin Selected Motor</button>
      <button class="secondary" onclick="quickSpin(-Number(document.getElementById('customDeg').value))">◀ Reverse</button>
    </div>
    <div class="toolbar" style="padding-top: 6px; border-top: 1px solid var(--border);">
      <button class="secondary small" onclick="sendCmd('M17')">🔒 Lock Motors (M17)</button>
      <button class="secondary small" onclick="sendCmd('M84 S0')">♾️ Stay Locked (M84 S0)</button>
      <button class="secondary small" onclick="sendCmd('M569 S1 X Y Z A')">🤫 Quiet Mode (StealthChop)</button>
      <button class="secondary small" onclick="sendCmd('M569 S0 X Y Z A')">💪 High Torque (SpreadCycle)</button>
      <button class="secondary small" onclick="sendCmd('M906 X600 Y600 Z600 A550')">⚡ Safe 600mA</button>
      <button class="secondary small" onclick="sendCmd('M500')">💾 Save Settings (M500)</button>
      <button class="secondary small" onclick="sendCmd('M119')">🔘 Check Endstops</button>
      <button class="secondary small" onclick="sendCmd('M122')">🔍 Driver Check</button>
    </div>
  </div>

  <div class="grid">
    <!-- LEFT: LIVE JOINT CONTROLS -->
    <div class="card">
      <h2>
        Live Joint Control
        <span style="font-size:0.8rem; color:var(--muted); font-weight:400;">
          Speed: <input id="speedInput" type="number" value="45" min="5" max="180" style="width:64px; padding:4px 6px;" /> °/s
        </span>
      </h2>

      <div id="jointsContainer"></div>

      <div class="row">
        <button class="success" style="flex:1;" onclick="sendCurrentPose()">▶ Move to Sliders</button>
        <button class="secondary" onclick="resetSliders()">↺ Center (0°)</button>
      </div>

      <h2 style="margin-top:6px;">Serial Console</h2>
      <div id="console" class="console"></div>
      <div class="row">
        <input id="gcodeInput" type="text" placeholder="Type G-code (e.g. G1 X90 F1800 or M122)..." />
        <button onclick="sendManualGcode()">Send</button>
      </div>
    </div>

    <!-- RIGHT: APP / ROUTINE DATABASE -->
    <div class="card">
      <h2>
        📦 App &amp; Routine Database
        <div class="row">
          <button class="secondary small" onclick="exportDB()">⬇ Export JSON</button>
          <button class="secondary small" onclick="document.getElementById('importFile').click()">⬆ Import</button>
          <input id="importFile" type="file" accept=".json" style="display:none" onchange="importDB(event)" />
        </div>
      </h2>

      <div class="joint">
        <div class="joint-header"><strong>Create New App / Pose</strong></div>
        <input id="appName" type="text" placeholder="App name (e.g. Wave Hello, Pick Cube)" />
        <textarea id="appSteps" rows="3" placeholder="G-code lines (leave blank to save current slider pose!)"></textarea>
        <div class="row">
          <button class="small" onclick="saveApp()">💾 Save to Database</button>
          <button class="secondary small" onclick="fillPoseIntoSteps()">+ Insert Current Pose</button>
        </div>
      </div>

      <div id="appList" class="app-list"></div>
    </div>
  </div>

  <script>
    const JOINTS = [
      { id: 'X', name: 'J1 — Base (XM)',     min: -135, max: 135, val: 0 },
      { id: 'Y', name: 'J2 — Shoulder (YM)', min: -45,  max: 120, val: 0 },
      { id: 'Z', name: 'J3 — Elbow (ZAM)',   min: -120, max: 120, val: 0 },
      { id: 'A', name: 'J4 — Wrist (EM)',    min: -90,  max: 90,  val: 0 },
      { id: 'G', name: 'Gripper Servo (P0)', min: 0,    max: 180, val: 90 }
    ];

    const DEFAULT_APPS = [
      {
        id: 'demo-home',
        name: 'Center Pose',
        gcode: 'G90\nG1 X0 Y0 Z0 A0 F2700\nM280 P0 S90'
      },
      {
        id: 'demo-spin',
        name: '2-Motor Bench Test (XM + YM)',
        gcode: 'G90\nG92 X0 Y0\nG1 X90 Y90 F2700\nM400\nG1 X0 Y0 F2700\nM400'
      }
    ];

    let port = null, writer = null, reader = null;
    let selectedMotor = 'X';
    let apps = JSON.parse(localStorage.getItem('ender_arm_apps') || 'null') || DEFAULT_APPS;

    function selectMotor(axis, btn) {
      selectedMotor = axis;
      document.querySelectorAll('#motorPills .pill').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    async function quickSpin(deg) {
      if (!deg || isNaN(deg)) return;
      const speed = Number(document.getElementById('speedInput').value || 45) * 60;
      await sendCmd('G91');
      await sendCmd(`G1 ${selectedMotor}${deg} F${speed}`);
      await sendCmd('G90');
    }

    function log(msg, cls = 'log-sys') {
      const el = document.getElementById('console');
      const span = document.createElement('div');
      span.className = cls;
      span.textContent = msg;
      el.appendChild(span);
      el.scrollTop = el.scrollHeight;
    }

    function renderJoints() {
      const c = document.getElementById('jointsContainer');
      c.innerHTML = '';
      JOINTS.forEach(j => {
        const div = document.createElement('div');
        div.className = 'joint';
        div.innerHTML = `
          <div class="joint-header">
            <span>${j.name}</span>
            <span class="joint-val" id="val-${j.id}">${j.val}°</span>
          </div>
          <div class="joint-controls">
            <button class="secondary small" onclick="jog('${j.id}', -15)">-15°</button>
            <input type="range" id="slider-${j.id}" min="${j.min}" max="${j.max}" value="${j.val}"
              oninput="updateJoint('${j.id}', this.value)" />
            <button class="secondary small" onclick="jog('${j.id}', 15)">+15°</button>
          </div>
        `;
        c.appendChild(div);
      });
    }

    function updateJoint(id, val) {
      const j = JOINTS.find(x => x.id === id);
      j.val = Number(val);
      document.getElementById(`val-${id}`).textContent = `${j.val}°`;
    }

    function jog(id, delta) {
      const j = JOINTS.find(x => x.id === id);
      j.val = Math.max(j.min, Math.min(j.max, j.val + delta));
      document.getElementById(`slider-${id}`).value = j.val;
      document.getElementById(`val-${id}`).textContent = `${j.val}°`;
      if (port) sendCurrentPose();
    }

    function resetSliders() {
      JOINTS.forEach(j => updateJoint(j.id, j.id === 'G' ? 90 : 0));
      renderJoints();
      if (port) sendCurrentPose();
    }

    async function connectSerial() {
      if (!('serial' in navigator)) {
        alert('Web Serial API requires Chrome or Edge on desktop.');
        return;
      }
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 115200 });
        writer = port.writable.getWriter();
        document.getElementById('statusBadge').textContent = 'Connected (115200)';
        document.getElementById('statusBadge').classList.add('connected');
        document.getElementById('connectBtn').textContent = '✅ Connected';
        log('Connected to SKR Mini E3 V3.0', 'log-sys');
        readLoop();
        await writer.write(new TextEncoder().encode('\n'));
        await new Promise(r => setTimeout(r, 150));
        await sendCmd('G90');
      } catch (err) {
        log('Connection failed: ' + err.message, 'log-sys');
      }
    }

    async function readLoop() {
      const decoder = new TextDecoderStream();
      port.readable.pipeTo(decoder.writable);
      reader = decoder.readable.getReader();
      let buf = '';
      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          const lines = buf.split('\n');
          buf = lines.pop();
          lines.forEach(l => { if (l.trim()) log('<< ' + l.trim(), 'log-rx'); });
        }
      } catch (err) {
        log('Disconnected: ' + err.message, 'log-sys');
      }
    }

    async function sendCmd(cmd) {
      if (!writer) { log('Not connected! Click Connect USB first.', 'log-sys'); return; }
      const clean = cmd.trim();
      if (!clean) return;
      log('>> ' + clean, 'log-tx');
      await writer.write(new TextEncoder().encode(clean + '\n'));
    }

    async function sendZero() {
      await sendCmd('G92 X0 Y0 Z0 A0');
      resetSliders();
    }

    async function sendCurrentPose() {
      const speed = Number(document.getElementById('speedInput').value || 45) * 60;
      const [x, y, z, a, g] = JOINTS.map(j => j.val);
      await sendCmd(`G1 X${x} Y${y} Z${z} A${a} F${speed}`);
      await sendCmd(`M280 P0 S${g}`);
    }

    function sendManualGcode() {
      const inp = document.getElementById('gcodeInput');
      sendCmd(inp.value);
      inp.value = '';
    }

    document.getElementById('gcodeInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendManualGcode();
    });
    document.getElementById('connectBtn').addEventListener('click', connectSerial);

    // --- APP DATABASE ---
    function persistApps() {
      localStorage.setItem('ender_arm_apps', JSON.stringify(apps));
      renderApps();
    }

    function fillPoseIntoSteps() {
      const speed = Number(document.getElementById('speedInput').value || 45) * 60;
      const [x, y, z, a, g] = JOINTS.map(j => j.val);
      const ta = document.getElementById('appSteps');
      const line = `G1 X${x} Y${y} Z${z} A${a} F${speed}\nM280 P0 S${g}\nM400`;
      ta.value = ta.value ? ta.value + '\n' + line : line;
    }

    function saveApp() {
      const name = document.getElementById('appName').value.trim();
      let gcode = document.getElementById('appSteps').value.trim();
      if (!name) { alert('Give your app a name!'); return; }
      if (!gcode) {
        const speed = Number(document.getElementById('speedInput').value || 45) * 60;
        const [x, y, z, a, g] = JOINTS.map(j => j.val);
        gcode = `G90\nG1 X${x} Y${y} Z${z} A${a} F${speed}\nM280 P0 S${g}`;
      }
      apps.unshift({ id: 'app-' + Date.now(), name, gcode });
      document.getElementById('appName').value = '';
      document.getElementById('appSteps').value = '';
      persistApps();
    }

    async function runApp(id) {
      const app = apps.find(a => a.id === id);
      if (!app) return;
      log(`--- Running App: ${app.name} ---`, 'log-sys');
      for (const line of app.gcode.split('\n')) {
        if (line.trim()) {
          await sendCmd(line);
          await new Promise(r => setTimeout(r, 120));
        }
      }
    }

    function deleteApp(id) {
      apps = apps.filter(a => a.id !== id);
      persistApps();
    }

    function renderApps() {
      const list = document.getElementById('appList');
      list.innerHTML = '';
      apps.forEach(app => {
        const div = document.createElement('div');
        div.className = 'app-item';
        div.innerHTML = `
          <div class="app-meta">
            <span class="app-name">${app.name}</span>
            <span class="app-desc">${app.gcode.split('\n')[0]} (${app.gcode.split('\n').length} cmds)</span>
          </div>
          <div class="row">
            <button class="success small" onclick="runApp('${app.id}')">▶ Run</button>
            <button class="secondary small" onclick="deleteApp('${app.id}')">🗑</button>
          </div>
        `;
        list.appendChild(div);
      });
    }

    function exportDB() {
      const blob = new Blob([JSON.stringify(apps, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'ender-arm-apps.json';
      a.click();
    }

    function importDB(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (Array.isArray(parsed)) { apps = parsed; persistApps(); }
        } catch { alert('Invalid JSON file'); }
      };
      reader.readAsText(file);
    }

    renderJoints();
    renderApps();
  </script>
</body>
</html>
