<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My App Hub</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 1rem; }
    .controls { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    input, select { padding: 0.6rem 0.9rem; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 1rem; }
    input { flex: 1; min-width: 220px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.2rem; text-decoration: none; color: inherit; transition: transform 0.15s, border-color 0.15s; }
    .card:hover { transform: translateY(-3px); border-color: #38bdf8; }
    .tag { display: inline-block; font-size: 0.75rem; background: #0284c7; padding: 0.2rem 0.55rem; border-radius: 999px; margin-bottom: 0.5rem; }
    .card h2 { margin: 0.25rem 0 0.5rem; font-size: 1.15rem; }
    .card p { margin: 0; font-size: 0.9rem; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>My App Hub</h1>
  <div class="controls">
    <input type="text" id="search" placeholder="Search apps..." />
    <select id="category"><option value="All">All Categories</option></select>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    let apps = [];
    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const category = document.getElementById('category');

    fetch('./apps.json')
      .then(r => r.json())
      .then(data => {
        apps = data;
        [...new Set(apps.map(a => a.category))].forEach(c => {
          category.innerHTML += `<option value="${c}">${c}</option>`;
        });
        render();
      });

    function render() {
      const q = search.value.toLowerCase();
      const cat = category.value;
      grid.innerHTML = apps
        .filter(a => (cat === 'All' || a.category === cat) && (a.name.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q)))
        .map(a => `<a class="card" href="${a.path}"><span class="tag">${a.category}</span><h2>${a.name}</h2><p>${a.desc}</p></a>`)
        .join('');
    }

    search.addEventListener('input', render);
    category.addEventListener('change', render);
  </script>
</body>
</html>
